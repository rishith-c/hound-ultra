<!doctype html><meta charset="utf-8"><title>scenes test</title>
<style>body{margin:0;background:#111;color:#ccc;font:12px monospace}canvas{display:block}#wrap{position:relative;display:inline-block;transform-origin:0 0}</style>
<div id="info"></div><div id="wrap"><canvas id="c"></canvas><canvas id="ov" style="position:absolute;left:0;top:0"></canvas></div>
<script type="module">
import * as S from './scenes.js?v=1795484078274';
import * as world from '../../core/world.js';
const q = new URLSearchParams(location.search), g = (k, d) => q.get(k) ?? d;
const mode = g('mode', 'scene'), theme = g('theme', 'mixed'), seed = +g('seed', 1), zoom = +g('zoom', 1), ox = +g('x', 0), oy = +g('y', 0), boxes = g('boxes', '0') === '1';
const wd = { SITE: world.SITE, BUILDING: world.BUILDING, ROOMS: world.ROOMS, OBSTACLES: world.OBSTACLES, HAZARDS: world.HAZARDS };
let scene, changes = [];
const t0 = performance.now();
if (mode === 'site') scene = S.buildSiteScene(wd, { leads: [{ id: 'D1', pos: [96.4, 70.2] }], team: [[22, 9], [23.2, 9.6]], before: g('before', '0') === '1' });
else scene = S.buildScene({ seed, theme, figures: +g('figures', 8) });
if (g('after', '0') === '1') { const m = S.mutateScene(scene, +g('mseed', 1)); scene = m.scene; changes = m.changes; }
const t1 = performance.now();
const c = document.getElementById('c');
const sh = g('shift', '0,0').split(',').map(Number);
S.renderScene(scene, { canvas: c, shift: sh, light: { gain: +g('gain', 1), tint: [1, 1, 1] } });
const t2 = performance.now();
const times = []; for (let i = 0; i < 3; i++) { const a = performance.now(); S.renderScene(scene, { canvas: c, shift: sh, light: { gain: +g('gain', 1), tint: [1, 1, 1] } }); times.push(Math.round(performance.now() - a)); }
window.T = { build: Math.round(t1 - t0), first: Math.round(t2 - t1), times, figs: scene.figures.length, dis: scene.distractors.length, nobj: scene.objects.length, json: JSON.stringify(scene).length };
window.scene = scene; window.changes = changes; window.S = S; window.wd = wd;
const ov = document.getElementById('ov'); ov.width = c.width; ov.height = c.height;
if (boxes) { const x = ov.getContext('2d'); x.lineWidth = 1; x.font = '10px monospace';
  for (const f of scene.figures) { x.strokeStyle = '#0f0'; const b = f.bbox; x.strokeRect(b[0] - .5 + sh[0], b[1] - .5 + sh[1], b[2] - b[0] + 1, b[3] - b[1] + 1); x.fillStyle = '#0f0'; x.fillText(f.id + ' ' + f.difficulty[0] + ' ' + f.posture[0] + (f.visible < 1 ? ' ' + f.visible : ''), b[0], b[1] - 3); }
  for (const d of scene.distractors) { x.strokeStyle = '#ff0'; const b = d.bbox; x.strokeRect(b[0] - .5, b[1] - .5, b[2] - b[0] + 1, b[3] - b[1] + 1); }
  for (const d of changes) { x.strokeStyle = '#f0f'; const b = d.bbox; x.strokeRect(b[0] - .5, b[1] - .5, b[2] - b[0] + 1, b[3] - b[1] + 1); x.fillStyle = '#f0f'; x.fillText(d.id + ' ' + d.label + ' ' + d.areaM2, b[0], b[1] - 3); } }
const wrap = document.getElementById('wrap'); wrap.style.transform = 'scale(' + zoom + ') translate(' + (-ox) + 'px,' + (-oy) + 'px)'; if (zoom > 1) c.style.imageRendering = ov.style.imageRendering = 'pixelated';
</script>

<!doctype html><meta charset=utf-8><body><script type=module>
import * as P from './physics.js'; import * as ST from './story.js'; import {classify,selfTest} from './voxel.js';
const q=new URLSearchParams(location.search), out={};window.PARTIAL=out;
try{ await P.loadRapier();
 for (const sc of (q.get('sc')||'leanto').split(',')) for (const seed of (q.get('seed')||'7').split(',').map(Number)) {
  const o=out[sc+seed]={}; const t0=performance.now(); const pile=P.buildPile({seed,scenario:sc,tie:+(q.get('tie')||1)});
  const r=ST.drain(ST.collapse(pile,()=>{})); o.frames=r.frames; let mx=0; for(const p of pile.pieces) mx=Math.max(mx,P.poseShift(r.before,r.rest,p.idx*7,p.radius)); o.restDrift=+mx.toFixed(3);
  const snap=P.snapshot(pile); const c=ST.drain(P.controlTrial(pile,snap,{})); o.control=c.nMoved+'/'+c.maxDisp.toFixed(3);
  { const w=P.restoreWorld(snap), sv=pile.world; const con=P.measureContacts(pile,w); o.ratio=+(con.ground/con.weight).toFixed(3); w.free(); }
  const pk=ST.pockets(pile,r.rest); o.voids=pk.vr.voids.length; const cl=classify(pile,r.rest,pk.g); o.cls=cl.verdict+' '+Object.entries(cl.scores).map(([k,v])=>k[0]+v.toFixed(2)).join(' ');
  o.ties=pile.ties.filter(t=>t.alive).length;o.t1=Math.round(performance.now()-t0); o.pk=[];
  o.tilt=''; const spc=ST.spaces(pile,+(q.get('pk')||3)); o.nsp=spc.length;
 for (const v of spc) { const box=v.box; const sites=ST.jackSites(pile,r.rest,box); const near=sites.map(s=>({...s,d:Math.hypot(s.x-box.c[0],s.z-box.c[2])})).sort((a,b)=>a.d-b.d).slice(0,+(q.get('n')||14));
   const rr=[]; let tj=performance.now(); for(const s of near){ const a=ST.drain(ST.jackRun(pile,snap,s,box)); if(ST.ruined(a)||q.get('all')) rr.push([pile.pieces[s.idx].id,s.x.toFixed(2),s.z.toFixed(2),'g'+s.gap.toFixed(2),'h'+a.head0.toFixed(2)+'>'+a.worst.toFixed(2)+'>'+a.head1.toFixed(2),'i'+a.intr0.toFixed(2)+'>'+a.worstI.toFixed(2),'F'+(a.peakF/1000).toFixed(0),'m'+a.moved.length,(a.moved[0]?.d||0).toFixed(2),ST.ruined(a)?'RUIN':''].join(' ')); if(ST.ruined(a)){ const ss=ST.shoreSites(pile,box,s); const res=[]; for(const h of ss){ const b=ST.drain(ST.jackRun(pile,snap,s,box,{shores:[h]})); res.push('['+h.x.toFixed(1)+','+h.z.toFixed(1)+' h'+h.h.toFixed(2)+' '+b.head0.toFixed(2)+'>'+b.worst.toFixed(2)+' i'+b.worstI.toFixed(2)+(ST.kept(b)?' KEPT':'')+']'); } rr.push('   shores '+res.join(' ')); } }
   o.pk.push({c:box.c.map(x=>+x.toFixed(2)),yaw:+box.yaw.toFixed(2),roof:v.roof.map(i=>pile.pieces[i].id).join(),nsites:sites.length,ms:Math.round((performance.now()-tj)),rr}); await new Promise(r=>setTimeout(r,0)); }
  pile.world.free(); await new Promise(r=>setTimeout(r,0));
 } out.done=1;out.self=selfTest().cases.map(c=>c.name+c.ok).join();
}catch(e){out.err=String(e.stack||e);} window.OUT=out; 
</script>

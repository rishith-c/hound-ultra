<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Horizon dev harness</title>
<link rel="stylesheet" href="../../ui/tokens.css"><link rel="stylesheet" href="../../ui/base.css">
<style>html,body{height:100%;margin:0}#root{position:absolute;inset:0;display:flex;flex-direction:column}</style></head>
<body><div id="root"></div>
<script type="module">
// Mounts the Horizon workspace alone, without the console shell. ?x=<exhibit id> opens one exhibit; ?motion=reduce tests reduced motion.
import * as kit from '../../ui/kit.js';
import { createBus } from '../../core/bus.js';
import ws from './index.js';
const q = new URLSearchParams(location.search);
if (q.get('motion') === 'reduce') document.documentElement.dataset.motion = 'reduce';
const bus = createBus();
const ctx = { kit, bus, prefs: {}, params: {}, shell: { toast: (t) => console.log('toast', t), open() {}, current: () => 'horizon' }, select() {} };
window.DEV = { ctx, bus };
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') bus.emit('escape'); });
const api = await ws.mount(document.getElementById('root'), ctx);
api.onShow?.(); window.DEV.api = api;
</script></body></html>

<!doctype html><body><script type=module>
const q=new URLSearchParams(location.search);const seeds=q.get('seeds').split(',').map(Number);window.RES={};let k=0;
function one(){ if(k>=seeds.length){return;} const key=k+':'+seeds[k], seed=seeds[k++]; const w=new Worker('./worker.js',{type:'module'}); let fr=0; const t0=performance.now();
 w.onmessage=({data:m})=>{ if(m.t==='chunk')fr+=m.frames; if(m.t==='lift'){ const b=m.box; RES[key]=[fr,'box '+b.c.map(v=>v.toFixed(2)).join()+' yaw '+b.yaw.toFixed(2),'jack '+m.piece+' '+m.site.x.toFixed(2)+','+m.site.z.toFixed(2)+' gap '+m.site.gap.toFixed(2),'shore '+m.shore.x.toFixed(2)+','+m.shore.z.toFixed(2)+' h'+m.shore.h.toFixed(2),'A '+m.a.head0.toFixed(2)+'>'+m.a.worst.toFixed(2)+' moved '+m.a.moved.length+' F '+(m.a.peakF/1000).toFixed(0)+' i'+m.a.worstI.toFixed(2),'B worst '+m.b.worst.toFixed(2)+' shore '+(Math.max(...m.b.tr.shore)/1000).toFixed(0),'tried '+m.tried,Math.round(performance.now()-t0)+'ms'].join(' | '); w.terminate(); one(); } if(m.t==='error'){RES[key]=fr+' '+m.message; w.terminate(); one();} };
 w.postMessage({seed,scenario:q.get('sc')||'vshape',tie:+(q.get('tie')||0.25),hint:null}); }
one();one();one();
</script>
